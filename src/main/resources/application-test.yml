spring:
  datasource:
    url: jdbc:h2:mem:shopnest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # Plaintext credential migrated to Azure Key Vault
  # secret: REDACTED
  expiration: 86400000

# Replace <your-vault-name> with your actual Azure Key Vault name
azure:
  keyvault:
    uri: https://<your-vault-name>.vault.azure.net
