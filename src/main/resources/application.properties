spring.application.name=ShopNest

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/shopnest}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
upload.path=uploads

# Gemini API Key - Get from https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:}

# Google OAuth2 Configuration
# Bạn cần tạo credentials tại https://console.cloud.google.com/apis/credentials
# 1. Tạo project mới hoặc chọn project hiện có
# 2. Vào APIs & Services > Credentials > Create Credentials > OAuth 2.0 Client IDs
# 3. Application type: Web application
# 4. Authorized redirect URIs: http://localhost:8080/login/oauth2/code/google
# 5. Copy Client ID và Client Secret vào file .env
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# Email Configuration (Gmail SMTP)
# Để sử dụng Gmail, bạn cần:
# 1. Bật 2-Step Verification trong Google Account
# 2. Tạo App Password tại: https://myaccount.google.com/apppasswords
# 3. Cấu hình trong file .env
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true