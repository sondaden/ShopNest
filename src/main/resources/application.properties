spring.application.name=ShopNest
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shopnest
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false

# Google OAuth2 Configuration
# Bạn cần tạo credentials tại https://console.cloud.google.com/apis/credentials
# 1. Tạo project mới hoặc chọn project hiện có
# 2. Vào APIs & Services > Credentials > Create Credentials > OAuth 2.0 Client IDs
# 3. Application type: Web application
# 4. Authorized redirect URIs: http://localhost:8080/login/oauth2/code/google
# 5. Copy Client ID và Client Secret vào file .env hoặc application-local.properties
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile