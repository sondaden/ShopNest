spring.application.name=ShopNest
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shopnest?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Plaintext credential migrated to Azure Key Vault
# spring.datasource.password=REDACTED
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# JWT Configuration
# Plaintext credential migrated to Azure Key Vault
# jwt.secret=REDACTED
jwt.expiration=86400000

# Replace <your-vault-name> with your actual Azure Key Vault name
azure.keyvault.uri=https://<your-vault-name>.vault.azure.net