spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/shopnest?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate           # không tạo lại bảng
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: 6Ly4d0F1eXNhbXBsZVNlY3JldEtleUZvclRlc3RpbmcxMjM0NTY=   # 256-bit
  expiration: 86400000   # 24h