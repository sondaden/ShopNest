<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục - ShopNest Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body>

<div class="admin-wrapper">
    <!-- Sidebar -->
    <aside th:replace="~{admin/fragments/admin-layout :: sidebar('categories')}"></aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <button class="btn btn-link d-lg-none me-2" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
            <h5 class="mb-0 fw-bold">Quản lý danh mục</h5>
            <div class="ms-auto">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#categoryModal">
                    <i class="bi bi-plus-lg me-2"></i>Thêm danh mục
                </button>
            </div>
        </header>

        <div class="admin-content">
            <div class="row g-4">
                <!-- Categories List -->
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-0 py-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-muted">Tổng <strong th:text="${categories?.size() ?: 0}">8</strong> danh mục</span>
                                <input type="text" class="form-control form-control-sm" style="width: 200px;" placeholder="Tìm danh mục...">
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th width="60"></th>
                                    <th>Tên danh mục</th>
                                    <th>Slug</th>
                                    <th>Số sản phẩm</th>
                                    <th>Trạng thái</th>
                                    <th width="100">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td>
                                        <div class="bg-primary bg-opacity-10 rounded d-flex align-items-center justify-content-center" style="width:48px;height:48px;">
                                            <i class="bi bi-tag text-primary"></i>
                                        </div>
                                    </td>
                                    <td class="fw-semibold" th:text="${cat.name}">Thời trang</td>
                                    <td class="text-muted" th:text="${cat.slug}">thoi-trang</td>
                                    <td th:text="${cat.products != null ? cat.products.size() : 0}">45</td>
                                    <td>
                                        <span class="badge bg-success">Hiển thị</span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <button class="btn btn-sm btn-outline-primary edit-category" 
                                                    th:data-id="${cat.id}" 
                                                    th:data-name="${cat.name}"
                                                    th:data-description="${cat.description}"
                                                    data-bs-toggle="modal" data-bs-target="#categoryModal" title="Sửa">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <form th:action="@{'/admin/categories/delete/' + ${cat.id}}" method="post" style="display:inline" 
                                                  onsubmit="return confirm('Bạn có chắc muốn xóa danh mục này?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${categories == null || #lists.isEmpty(categories)}">
                                    <td colspan="6" class="text-center py-5">
                                        <i class="bi bi-folder2-open text-muted" style="font-size: 3rem;"></i>
                                        <p class="text-muted mt-2 mb-0">Chưa có danh mục nào</p>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Quick Stats -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white border-0 py-3">
                            <h6 class="fw-bold mb-0">Thống kê nhanh</h6>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-3">
                                <span class="text-muted">Tổng danh mục</span>
                                <span class="fw-bold" th:text="${#lists.size(categories)}">0</span>
                            </div>
                            <hr>
                            <p class="text-muted small mb-0">Thêm danh mục để phân loại sản phẩm tốt hơn</p>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-0 py-3">
                            <h6 class="fw-bold mb-0">Danh mục có sản phẩm</h6>
                        </div>
                        <div class="card-body">
                            <div class="d-flex align-items-center mb-3" th:each="cat : ${categories}" th:if="${cat.products != null and !cat.products.isEmpty()}">
                                <div class="flex-grow-1">
                                    <span class="fw-semibold" th:text="${cat.name}">Danh mục</span>
                                </div>
                                <span class="ms-3 badge bg-primary" th:text="${#lists.size(cat.products) + ' SP'}">0 SP</span>
                            </div>
                            <div th:if="${#lists.isEmpty(categories)}" class="text-center text-muted py-2">
                                <small>Chưa có dữ liệu</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Category Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="categoryModalTitle">Thêm danh mục mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/categories/save}" method="post">
                <input type="hidden" name="categoryId" id="categoryId">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" id="categoryName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" name="description" id="categoryDescription" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu danh mục</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Edit category - fill modal with data
    document.querySelectorAll('.edit-category').forEach(btn => {
        btn.addEventListener('click', function() {
            document.getElementById('categoryModalTitle').textContent = 'Sửa danh mục';
            document.getElementById('categoryId').value = this.dataset.id;
            document.getElementById('categoryName').value = this.dataset.name;
            document.getElementById('categoryDescription').value = this.dataset.description || '';
        });
    });

    // Reset modal on add new
    document.querySelector('[data-bs-target="#categoryModal"]').addEventListener('click', function() {
        document.getElementById('categoryModalTitle').textContent = 'Thêm danh mục mới';
        document.getElementById('categoryId').value = '';
        document.getElementById('categoryName').value = '';
        document.getElementById('categoryDescription').value = '';
    });
});
</script>

</body>
</html>
