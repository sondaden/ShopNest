<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Admin Sidebar Fragment -->
<aside th:fragment="sidebar(activePage)" class="admin-sidebar" id="sidebar">
    <div class="sidebar-header">
        <a th:href="@{/admin}" class="sidebar-brand">
            <i class="bi bi-shop me-2"></i>ShopNest
        </a>
        <button class="btn btn-link d-lg-none sidebar-close" id="sidebarClose">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
    <nav class="sidebar-nav">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a th:href="@{/admin}" class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                    <i class="bi bi-speedometer2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/products}" class="nav-link" th:classappend="${activePage == 'products' ? 'active' : ''}">
                    <i class="bi bi-box-seam"></i>Sản phẩm
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/categories}" class="nav-link" th:classappend="${activePage == 'categories' ? 'active' : ''}">
                    <i class="bi bi-tags"></i>Danh mục
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/orders}" class="nav-link" th:classappend="${activePage == 'orders' ? 'active' : ''}">
                    <i class="bi bi-cart-check"></i>Đơn hàng
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/users}" class="nav-link" th:classappend="${activePage == 'users' ? 'active' : ''}">
                    <i class="bi bi-people"></i>Người dùng
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/reports}" class="nav-link" th:classappend="${activePage == 'reports' ? 'active' : ''}">
                    <i class="bi bi-bar-chart"></i>Báo cáo
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/settings}" class="nav-link" th:classappend="${activePage == 'settings' ? 'active' : ''}">
                    <i class="bi bi-gear"></i>Cài đặt
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/profile}" class="nav-link" th:classappend="${activePage == 'profile' ? 'active' : ''}">
                    <i class="bi bi-person-circle"></i>Hồ sơ cá nhân
                </a>
            </li>
        </ul>
    </nav>
    <div class="sidebar-footer">
        <a th:href="@{/admin}" class="btn btn-outline-light btn-sm w-100">
            <i class="bi bi-arrow-left me-2"></i>Về Dashboard
        </a>
    </div>
</aside>

<!-- Admin Header Fragment -->
<header th:fragment="header(title)" class="admin-header">
    <button class="btn btn-link d-lg-none me-2" id="sidebarToggle">
        <i class="bi bi-list fs-4"></i>
    </button>
    <h5 class="mb-0 fw-bold" th:text="${title}">Admin</h5>
    <div class="ms-auto d-flex align-items-center gap-3">
        <div class="dropdown">
            <button class="btn btn-light d-flex align-items-center gap-2" data-bs-toggle="dropdown">
                <img src="https://ui-avatars.com/api/?name=Admin&background=0d6efd&color=fff&size=32" 
                     class="rounded-circle" width="32" height="32" alt="Admin">
                <span class="d-none d-md-inline">Admin</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Hồ sơ</a></li>
                <li><a class="dropdown-item" th:href="@{/admin/settings}"><i class="bi bi-gear me-2"></i>Cài đặt</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>

<!-- Admin Scripts Fragment -->
<script th:fragment="scripts">
document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarClose = document.getElementById('sidebarClose');

    sidebarToggle?.addEventListener('click', () => sidebar.classList.add('show'));
    sidebarClose?.addEventListener('click', () => sidebar.classList.remove('show'));
});
</script>

</body>
</html>
