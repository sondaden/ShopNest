<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product?.id != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm'} + ' - ShopNest Admin'">Thêm sản phẩm - ShopNest Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body>

<div class="admin-wrapper">
    <!-- Sidebar -->
    <aside th:replace="~{admin/fragments/admin-layout :: sidebar('products')}"></aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <a th:href="@{/admin/products}" class="btn btn-link text-dark me-2">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h5 class="mb-0 fw-bold" th:text="${product?.id != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm mới'}">Thêm sản phẩm mới</h5>
        </header>

        <div class="admin-content">
            <form th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="productId" th:value="${product?.id}">
                
                <div class="row g-4">
                    <div class="col-lg-8">
                        <!-- Basic Info -->
                        <div class="card border-0 shadow-sm mb-4">
                            <div class="card-header bg-white border-0 py-3">
                                <h6 class="fw-bold mb-0">Thông tin cơ bản</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" name="name" th:value="${product?.name}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="imageUrl" class="form-label">URL Hình ảnh</label>
                                    <input type="text" class="form-control" id="imageUrl" name="imageUrl" th:value="${product?.imageUrl}" placeholder="https://example.com/image.jpg">
                                </div>
                                <div class="mb-3">
                                    <label for="description" class="form-label">Mô tả sản phẩm</label>
                                    <textarea class="form-control" id="description" name="description" rows="5" th:text="${product?.description}"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Image Preview -->
                        <div class="card border-0 shadow-sm mb-4" th:if="${product?.imageUrl}">
                            <div class="card-header bg-white border-0 py-3">
                                <h6 class="fw-bold mb-0">Hình ảnh hiện tại</h6>
                            </div>
                            <div class="card-body">
                                <img th:src="${product.imageUrl}" class="img-fluid rounded" style="max-height: 200px;" alt="Product">
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <!-- Pricing -->
                        <div class="card border-0 shadow-sm mb-4">
                            <div class="card-header bg-white border-0 py-3">
                                <h6 class="fw-bold mb-0">Giá & Kho hàng</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="price" class="form-label">Giá bán <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="price" name="price" th:value="${product?.price}" required min="0">
                                        <span class="input-group-text">₫</span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="stock" class="form-label">Số lượng tồn kho <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="stock" name="stock" th:value="${product?.stock ?: 0}" required min="0">
                                </div>
                                <div class="mb-3">
                                    <label for="rating" class="form-label">Đánh giá (0-5)</label>
                                    <input type="number" class="form-control" id="rating" name="rating" th:value="${product?.rating ?: 0}" min="0" max="5" step="0.1">
                                </div>
                            </div>
                        </div>

                        <!-- Category -->
                        <div class="card border-0 shadow-sm mb-4">
                            <div class="card-header bg-white border-0 py-3">
                                <h6 class="fw-bold mb-0">Phân loại</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="categoryId" class="form-label">Danh mục <span class="text-danger">*</span></label>
                                    <select class="form-select" id="categoryId" name="categoryId" required>
                                        <option value="">Chọn danh mục</option>
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${product?.category?.id == cat.id}">Danh mục</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-lg me-2"></i>
                                <span th:text="${product?.id != null ? 'Cập nhật sản phẩm' : 'Thêm sản phẩm'}">Thêm sản phẩm</span>
                            </button>
                            <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Hủy</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const nameInput = document.getElementById('name');
    const slugInput = document.getElementById('slug');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');

    // Auto generate slug from name
    nameInput.addEventListener('input', function() {
        if (!slugInput.value) {
            slugInput.value = this.value
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-|-$)/g, '');
        }
    });

    // Image preview
    imageInput.addEventListener('change', function() {
        Array.from(this.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const col = document.createElement('div');
                col.className = 'col-3';
                col.innerHTML = `
                    <div class="position-relative">
                        <img src="${e.target.result}" class="img-fluid rounded" alt="Preview">
                        <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 remove-image">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                `;
                imagePreview.appendChild(col);
            };
            reader.readAsDataURL(file);
        });
    });

    // Remove image
    imagePreview.addEventListener('click', function(e) {
        if (e.target.closest('.remove-image')) {
            e.target.closest('.col-3').remove();
        }
    });
});
</script>

</body>
</html>
