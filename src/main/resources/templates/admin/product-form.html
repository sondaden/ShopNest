<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product?.id != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm'} + ' - ShopNest Admin'">Thêm sản phẩm - ShopNest Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body>

<div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="sidebar-header">
            <a th:href="@{/admin}" class="sidebar-brand">
                <i class="bi bi-shop me-2"></i>ShopNest
            </a>
        </div>
        <nav class="sidebar-nav">
            <ul class="nav flex-column">
                <li class="nav-item"><a th:href="@{/admin}" class="nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
                <li class="nav-item"><a th:href="@{/admin/products}" class="nav-link active"><i class="bi bi-box-seam"></i>Sản phẩm</a></li>
                <li class="nav-item"><a th:href="@{/admin/categories}" class="nav-link"><i class="bi bi-tags"></i>Danh mục</a></li>
                <li class="nav-item"><a th:href="@{/admin/orders}" class="nav-link"><i class="bi bi-cart-check"></i>Đơn hàng</a></li>
                <li class="nav-item"><a th:href="@{/admin/users}" class="nav-link"><i class="bi bi-people"></i>Người dùng</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/}" class="btn btn-outline-light btn-sm w-100"><i class="bi bi-arrow-left me-2"></i>Về trang chủ</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <a th:href="@{/admin/products}" class="btn btn-link text-dark me-2">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h5 class="mb-0 fw-bold" th:text="${product?.id != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm mới'}">Thêm sản phẩm mới</h5>
        </header>

        <div class="admin-content">
            <form th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${product?.id}">
                
                <div class="row g-4">
                    <div class="col-lg-8">
                        <!-- Basic Info -->
                        <div class="card border-0 shadow-sm mb-4">
                            <div class="card-header bg-white border-0 py-3">
                                <h6 class="fw-bold mb-0">Thông tin cơ bản</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" name="name" th:value="${product?.name}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="slug" class="form-label">Đường dẫn (slug)</label>
                                    <input type="text" class="form-control" id="slug" name="slug" th:value="${product?.slug}" placeholder="tu-dong-tao-tu-ten">
                                </div>
                                <div class="mb-3">
                                    <label for="description" class="form-label">Mô tả sản phẩm</label>
                                    <textarea class="form-control" id="description" name="description" rows="5" th:text="${product?.description}"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Images -->
                        <div class="card border-0 shadow-sm mb-4">
                            <div class="card-header bg-white border-0 py-3">
                                <h6 class="fw-bold mb-0">Hình ảnh</h6>
                            </div>
                            <div class="card-body">
                                <div class="upload-zone text-center p-4 border border-2 border-dashed rounded-3" id="uploadZone">
                                    <i class="bi bi-cloud-upload fs-1 text-muted"></i>
                                    <p class="mb-2">Kéo thả hình ảnh vào đây hoặc</p>
                                    <label class="btn btn-outline-primary">
                                        Chọn hình ảnh
                                        <input type="file" name="images" multiple accept="image/*" class="d-none" id="imageInput">
                                    </label>
                                    <p class="text-muted small mt-2 mb-0">PNG, JPG, WEBP (tối đa 5MB)</p>
                                </div>
                                <div class="row g-2 mt-3" id="imagePreview">
                                    <div class="col-3" th:if="${product?.imageUrl}">
                                        <div class="position-relative">
                                            <img th:src="${product.imageUrl}" class="img-fluid rounded" alt="Product">
                                            <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1">
                                                <i class="bi bi-x"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <!-- Pricing -->
                        <div class="card border-0 shadow-sm mb-4">
                            <div class="card-header bg-white border-0 py-3">
                                <h6 class="fw-bold mb-0">Giá & Kho hàng</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="price" class="form-label">Giá bán <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="price" name="price" th:value="${product?.price}" required min="0">
                                        <span class="input-group-text">₫</span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="comparePrice" class="form-label">Giá gốc (nếu giảm giá)</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="comparePrice" name="comparePrice" min="0">
                                        <span class="input-group-text">₫</span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="stock" class="form-label">Số lượng tồn kho <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="stock" name="stock" th:value="${product?.stock ?: 0}" required min="0">
                                </div>
                            </div>
                        </div>

                        <!-- Category -->
                        <div class="card border-0 shadow-sm mb-4">
                            <div class="card-header bg-white border-0 py-3">
                                <h6 class="fw-bold mb-0">Phân loại</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="category" class="form-label">Danh mục <span class="text-danger">*</span></label>
                                    <select class="form-select" id="category" name="category" required>
                                        <option value="">Chọn danh mục</option>
                                        <option th:each="cat : ${categories}" th:value="${cat.name}" th:text="${cat.name}" th:selected="${product?.category == cat.name}">Danh mục</option>
                                        <option value="Thời trang" th:if="${categories == null}">Thời trang</option>
                                        <option value="Điện tử" th:if="${categories == null}">Điện tử</option>
                                        <option value="Gia dụng" th:if="${categories == null}">Gia dụng</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="brand" class="form-label">Thương hiệu</label>
                                    <input type="text" class="form-control" id="brand" name="brand" th:value="${product?.brand}">
                                </div>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-lg me-2"></i>
                                <span th:text="${product?.id != null ? 'Cập nhật sản phẩm' : 'Thêm sản phẩm'}">Thêm sản phẩm</span>
                            </button>
                            <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Hủy</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const nameInput = document.getElementById('name');
    const slugInput = document.getElementById('slug');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');

    // Auto generate slug from name
    nameInput.addEventListener('input', function() {
        if (!slugInput.value) {
            slugInput.value = this.value
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-|-$)/g, '');
        }
    });

    // Image preview
    imageInput.addEventListener('change', function() {
        Array.from(this.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const col = document.createElement('div');
                col.className = 'col-3';
                col.innerHTML = `
                    <div class="position-relative">
                        <img src="${e.target.result}" class="img-fluid rounded" alt="Preview">
                        <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 remove-image">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                `;
                imagePreview.appendChild(col);
            };
            reader.readAsDataURL(file);
        });
    });

    // Remove image
    imagePreview.addEventListener('click', function(e) {
        if (e.target.closest('.remove-image')) {
            e.target.closest('.col-3').remove();
        }
    });
});
</script>

</body>
</html>
