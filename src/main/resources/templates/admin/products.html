<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - ShopNest Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body>

<div class="admin-wrapper">
    <!-- Sidebar -->
    <aside th:replace="~{admin/fragments/admin-layout :: sidebar('products')}"></aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <button class="btn btn-link d-lg-none me-2" id="sidebarToggle">
                <i class="bi bi-list fs-4"></i>
            </button>
            <h5 class="mb-0 fw-bold">Quản lý sản phẩm</h5>
            <div class="ms-auto">
                <a th:href="@{/admin/products/add}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-2"></i>Thêm sản phẩm
                </a>
            </div>
        </header>

        <div class="admin-content">
            <!-- Filters -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <form class="row g-3 align-items-end" th:action="@{/admin/products}" method="get">
                        <div class="col-md-4">
                            <label class="form-label">Tìm kiếm</label>
                            <input type="text" class="form-control" placeholder="Tên sản phẩm..." name="search" th:value="${search}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Danh mục</label>
                            <select class="form-select" name="categoryId">
                                <option value="">Tất cả danh mục</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${categoryId == cat.id}">Danh mục</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="bi bi-search me-1"></i>Tìm kiếm
                            </button>
                            <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Xóa lọc</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Products Table -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                    <span class="text-muted">Hiển thị <strong th:text="${products?.size() ?: 0}">10</strong> sản phẩm</span>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-download me-1"></i>Xuất Excel
                        </button>
                        <button class="btn btn-outline-danger btn-sm" id="deleteSelected" disabled>
                            <i class="bi bi-trash me-1"></i>Xóa đã chọn
                        </button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th width="40">
                                <input type="checkbox" class="form-check-input" id="selectAll">
                            </th>
                            <th>Sản phẩm</th>
                            <th>Danh mục</th>
                            <th>Giá</th>
                            <th>Tồn kho</th>
                            <th>Trạng thái</th>
                            <th width="120">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="product : ${products}">
                            <td>
                                <input type="checkbox" class="form-check-input product-checkbox" th:value="${product.id}">
                            </td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://placehold.co/48'}" class="rounded" width="48" height="48" style="object-fit:cover" alt="Product">
                                    <div class="ms-3">
                                        <h6 class="mb-0" th:text="${product.name}">Tên sản phẩm</h6>
                                        <small class="text-muted" th:text="${'ID: ' + product.id}">ID: 1</small>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${product.category != null ? product.category.name : '-'}">-</td>
                            <td class="text-danger fw-semibold" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</td>
                            <td>
                                <span th:class="${product.stock < 10 ? 'text-danger fw-bold' : ''}" th:text="${product.stock}">0</span>
                            </td>
                            <td>
                                <span class="badge bg-success" th:if="${product.stock > 0}">Đang bán</span>
                                <span class="badge bg-warning" th:if="${product.stock == 0}">Hết hàng</span>
                            </td>
                            <td>
                                <div class="btn-group">
                                    <a th:href="@{'/admin/products/edit/' + ${product.id}}" class="btn btn-sm btn-outline-primary" title="Sửa">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{'/admin/products/delete/' + ${product.id}}" method="post" style="display:inline" class="delete-form">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="7" class="text-center py-5">
                                <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
                                <p class="text-muted mt-2 mb-0">Chưa có sản phẩm nào</p>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                    <div class="text-muted">
                        Trang <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages > 0 ? totalPages : 1}">1</span>
                        (<span th:text="${totalItems}">0</span> sản phẩm)
                    </div>
                    <nav th:if="${totalPages > 1}">
                        <ul class="pagination mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/products(page=${currentPage - 1}, search=${search}, categoryId=${categoryId})}">Trước</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/admin/products(page=${i}, search=${search}, categoryId=${categoryId})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/products(page=${currentPage + 1}, search=${search}, categoryId=${categoryId})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarClose = document.getElementById('sidebarClose');
    const selectAll = document.getElementById('selectAll');
    const deleteSelected = document.getElementById('deleteSelected');

    sidebarToggle?.addEventListener('click', () => sidebar.classList.add('show'));
    sidebarClose?.addEventListener('click', () => sidebar.classList.remove('show'));

    // Select all checkboxes
    selectAll?.addEventListener('change', function() {
        document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = this.checked);
        updateDeleteButton();
    });

    document.querySelectorAll('.product-checkbox').forEach(cb => {
        cb.addEventListener('change', updateDeleteButton);
    });

    function updateDeleteButton() {
        const checked = document.querySelectorAll('.product-checkbox:checked').length;
        deleteSelected.disabled = checked === 0;
    }

    // Delete single product with custom confirm
    document.querySelectorAll('.delete-form').forEach(form => {
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const confirmed = await window.showConfirm('Bạn có chắc muốn xóa sản phẩm này? Hành động này không thể hoàn tác.', {
                title: 'Xóa sản phẩm',
                confirmText: 'Xóa',
                cancelText: 'Hủy',
                type: 'danger'
            });
            if (confirmed) {
                this.submit();
            }
        });
    });
});
</script>

</body>
</html>
