<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <title>Xác nhận OTP - ShopNest</title>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <!-- Logo -->
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock display-4 text-primary"></i>
                        <h4 class="fw-bold mt-2">Xác nhận OTP</h4>
                        <p class="text-muted">Nhập mã xác nhận đã gửi đến email</p>
                        <p class="text-primary fw-semibold" th:text="${email}">user@email.com</p>
                    </div>

                    <!-- Error Message -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        <span th:text="${error}">Lỗi</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    
                    <!-- Success Message -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i>
                        <span th:text="${success}">Thành công</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Form xác nhận OTP và đặt mật khẩu mới -->
                    <form th:action="@{/forgot-password/reset}" method="post" id="resetForm">
                        <input type="hidden" name="email" th:value="${email}">
                        
                        <!-- OTP Input -->
                        <div class="mb-4">
                            <label for="otp" class="form-label">Mã xác nhận (OTP)</label>
                            <div class="otp-inputs d-flex justify-content-between gap-2">
                                <input type="text" class="form-control text-center otp-input" maxlength="1" data-index="0" autofocus>
                                <input type="text" class="form-control text-center otp-input" maxlength="1" data-index="1">
                                <input type="text" class="form-control text-center otp-input" maxlength="1" data-index="2">
                                <input type="text" class="form-control text-center otp-input" maxlength="1" data-index="3">
                                <input type="text" class="form-control text-center otp-input" maxlength="1" data-index="4">
                                <input type="text" class="form-control text-center otp-input" maxlength="1" data-index="5">
                            </div>
                            <input type="hidden" name="otp" id="otpValue">
                            <small class="text-muted">Mã gồm 6 chữ số, hết hạn sau 5 phút</small>
                        </div>
                        
                        <!-- New Password -->
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" 
                                       class="form-control" 
                                       id="newPassword" 
                                       name="newPassword" 
                                       placeholder="Nhập mật khẩu mới"
                                       minlength="6"
                                       required>
                                <button class="btn btn-outline-secondary toggle-password" type="button">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" 
                                       class="form-control" 
                                       id="confirmPassword" 
                                       name="confirmPassword" 
                                       placeholder="Nhập lại mật khẩu"
                                       minlength="6"
                                       required>
                                <button class="btn btn-outline-secondary toggle-password" type="button">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="resetBtn">
                            <i class="bi bi-check-lg me-2"></i>Đặt lại mật khẩu
                        </button>
                    </form>
                    
                    <!-- Resend OTP -->
                    <div class="text-center border-top pt-3 mt-3">
                        <span class="text-muted">Không nhận được mã?</span>
                        <form th:action="@{/forgot-password/resend-otp}" method="post" class="d-inline">
                            <input type="hidden" name="email" th:value="${email}">
                            <button type="submit" class="btn btn-link p-0 text-decoration-none" id="resendBtn">
                                Gửi lại OTP
                            </button>
                        </form>
                    </div>
                    
                    <div class="text-center mt-3">
                        <a th:href="@{/forgot-password}" class="text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>Đổi email khác
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<style>
.otp-input {
    width: 45px;
    height: 50px;
    font-size: 1.5rem;
    font-weight: bold;
    border-radius: 8px;
}
.otp-input:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
}
</style>

<script>
// OTP inputs handling
const otpInputs = document.querySelectorAll('.otp-input');
const otpValue = document.getElementById('otpValue');

otpInputs.forEach((input, index) => {
    input.addEventListener('input', function(e) {
        // Only allow numbers
        this.value = this.value.replace(/[^0-9]/g, '');
        
        // Auto focus next input
        if (this.value.length === 1 && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
        }
        
        // Update hidden OTP value
        updateOtpValue();
    });
    
    input.addEventListener('keydown', function(e) {
        // Handle backspace
        if (e.key === 'Backspace' && this.value === '' && index > 0) {
            otpInputs[index - 1].focus();
        }
    });
    
    // Handle paste
    input.addEventListener('paste', function(e) {
        e.preventDefault();
        const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '');
        
        for (let i = 0; i < pastedData.length && i < otpInputs.length; i++) {
            otpInputs[i].value = pastedData[i];
        }
        
        // Focus the next empty input or last one
        const nextEmpty = Array.from(otpInputs).find(inp => inp.value === '');
        if (nextEmpty) {
            nextEmpty.focus();
        } else {
            otpInputs[otpInputs.length - 1].focus();
        }
        
        updateOtpValue();
    });
});

function updateOtpValue() {
    otpValue.value = Array.from(otpInputs).map(input => input.value).join('');
}

// Toggle password visibility
document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', function() {
        const input = this.previousElementSibling;
        const icon = this.querySelector('i');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    });
});

// Form validation
document.getElementById('resetForm').addEventListener('submit', function(e) {
    const otp = otpValue.value;
    if (otp.length !== 6) {
        e.preventDefault();
        alert('Vui lòng nhập đầy đủ 6 chữ số OTP!');
        return;
    }
    
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    
    if (newPass !== confirmPass) {
        e.preventDefault();
        alert('Mật khẩu xác nhận không khớp!');
        return;
    }
    
    var btn = document.getElementById('resetBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';
});
</script>

</body>
</html>
