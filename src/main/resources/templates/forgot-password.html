<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <title>Quên mật khẩu - ShopNest</title>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <!-- Logo -->
                    <div class="text-center mb-4">
                        <img th:src="@{/images/logo.png}" alt="ShopNest" style="height: 80px;" class="mb-2">
                        <h4 class="fw-bold mt-2">Quên mật khẩu</h4>
                        <p class="text-muted">Nhập email để nhận mã xác nhận</p>
                    </div>

                    <!-- Error Message -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        <span th:text="${error}">Lỗi</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Form nhập email -->
                    <form th:action="@{/forgot-password/send-otp}" method="post">
                        <div class="mb-4">
                            <label for="email" class="form-label">Email đã đăng ký</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" 
                                       class="form-control" 
                                       id="email" 
                                       name="email" 
                                       placeholder="Nhập email của bạn"
                                       th:value="${email}"
                                       required 
                                       autofocus>
                            </div>
                            <small class="text-muted">Chúng tôi sẽ gửi mã xác nhận đến email này</small>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="sendOtpBtn">
                            <i class="bi bi-send me-2"></i>Gửi mã xác nhận
                        </button>

                        <div class="text-center">
                            <a th:href="@{/login}" class="text-decoration-none">
                                <i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập
                            </a>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Hướng dẫn -->
            <div class="card mt-4 border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="fw-bold mb-3"><i class="bi bi-info-circle me-2 text-primary"></i>Hướng dẫn</h6>
                    <ol class="small text-muted mb-0 ps-3">
                        <li>Nhập email bạn đã dùng để đăng ký tài khoản</li>
                        <li>Kiểm tra hộp thư (cả spam) để lấy mã OTP</li>
                        <li>Nhập mã OTP và đặt mật khẩu mới</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    document.querySelector('form').addEventListener('submit', function() {
        var btn = document.getElementById('sendOtpBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang gửi...';
    });
</script>

</body>
</html>
