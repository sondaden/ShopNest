<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Chatbot Widget Fragment -->
<div th:fragment="chatWidget" id="chatbot-widget">
    <!-- Chat Toggle Button -->
    <button id="chat-toggle" class="chat-toggle-btn">
        <i class="bi bi-chat-dots-fill" id="chat-icon"></i>
        <i class="bi bi-x-lg d-none" id="close-icon"></i>
    </button>

    <!-- Chat Window -->
    <div id="chat-window" class="chat-window d-none">
        <div class="chat-header">
            <div class="d-flex align-items-center">
                <i class="bi bi-robot me-2"></i>
                <span class="fw-bold">ShopNest Assistant</span>
            </div>
            <span class="badge bg-success">Online</span>
        </div>
        
        <div id="chat-messages" class="chat-messages">
            <div class="message bot-message">
                <div class="message-content">
                    Xin chào! 👋 Tôi là trợ lý ảo của ShopNest. Tôi có thể giúp gì cho bạn?
                </div>
            </div>
        </div>
        
        <div class="chat-input-area">
            <form id="chat-form">
                <div class="input-group">
                    <input type="text" id="chat-input" class="form-control" 
                           placeholder="Nhập tin nhắn..." autocomplete="off">
                    <button type="submit" class="btn btn-primary" id="send-btn">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <style>
        /* Chatbot Styles */
        #chatbot-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        .chat-toggle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .chat-window {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 380px;
            height: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f8f9fa;
        }

        .message { margin-bottom: 12px; display: flex; }

        .message-content {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .bot-message { justify-content: flex-start; }
        .bot-message .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .user-message { justify-content: flex-end; }
        .user-message .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-input-area {
            padding: 12px 16px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .chat-input-area .input-group {
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .chat-input-area .form-control {
            border: none;
            padding: 12px 16px;
            font-size: 14px;
        }

        .chat-input-area .form-control:focus { box-shadow: none; }

        .chat-input-area .btn {
            border: none;
            padding: 12px 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .typing-indicator { display: flex; align-items: center; padding: 10px 14px; }
        .typing-indicator span {
            width: 8px; height: 8px;
            background: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        @media (max-width: 480px) {
            .chat-window { width: calc(100vw - 40px); height: 60vh; right: -10px; }
        }
    </style>
    
    <script>
        (function() {
            // Toggle chat window
            document.getElementById('chat-toggle').addEventListener('click', function() {
                var chatWindow = document.getElementById('chat-window');
                var chatIcon = document.getElementById('chat-icon');
                var closeIcon = document.getElementById('close-icon');
                
                chatWindow.classList.toggle('d-none');
                chatIcon.classList.toggle('d-none');
                closeIcon.classList.toggle('d-none');
                
                if (!chatWindow.classList.contains('d-none')) {
                    document.getElementById('chat-input').focus();
                }
            });

            // Send message
            document.getElementById('chat-form').addEventListener('submit', function(event) {
                event.preventDefault();
                
                var input = document.getElementById('chat-input');
                var message = input.value.trim();
                
                if (!message) return;
                
                addMessage(message, 'user');
                input.value = '';
                showTyping();
                
                fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                })
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    hideTyping();
                    if (data.response) {
                        addMessage(data.response, 'bot');
                    } else if (data.error) {
                        addMessage('Xin lỗi, đã xảy ra lỗi: ' + data.error, 'bot');
                    }
                })
                .catch(function(error) {
                    hideTyping();
                    addMessage('Xin lỗi, không thể kết nối đến server.', 'bot');
                    console.error('Chat error:', error);
                });
            });

            function addMessage(text, sender) {
                var messagesContainer = document.getElementById('chat-messages');
                var messageDiv = document.createElement('div');
                messageDiv.className = 'message ' + sender + '-message';
                
                var formattedText = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\n/g, '<br>');
                
                messageDiv.innerHTML = '<div class="message-content">' + formattedText + '</div>';
                messagesContainer.appendChild(messageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function showTyping() {
                var messagesContainer = document.getElementById('chat-messages');
                var typingDiv = document.createElement('div');
                typingDiv.id = 'typing-indicator';
                typingDiv.className = 'message bot-message';
                typingDiv.innerHTML = '<div class="message-content typing-indicator"><span></span><span></span><span></span></div>';
                messagesContainer.appendChild(typingDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function hideTyping() {
                var typing = document.getElementById('typing-indicator');
                if (typing) typing.remove();
            }
        })();
    </script>
</div>
</html>
