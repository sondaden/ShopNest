<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - ShopNest' : 'ShopNest'}">ShopNest</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <!-- Bootstrap JS (needed for dropdown) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<!-- Navbar Fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
            <i class="bi bi-shop me-2"></i>ShopNest
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:classappend="${currentPath == '/' ? 'active' : ''}">
                        <i class="bi bi-house-door me-1"></i>Trang chủ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}" th:classappend="${currentPath != null && currentPath.startsWith('/products') ? 'active' : ''}">
                        <i class="bi bi-grid me-1"></i>Sản phẩm
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/orders}" th:classappend="${currentPath != null && currentPath.startsWith('/orders') ? 'active' : ''}">
                        <i class="bi bi-bag-check me-1"></i>Đơn hàng
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-center">
                <li class="nav-item me-2">
                    <a class="nav-link nav-icon position-relative" th:href="@{/cart}" title="Giỏ hàng">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="cart-badge position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:if="${cartCount != null && cartCount > 0}" th:text="${cartCount}">0</span>
                    </a>
                </li>
                <!-- Not authenticated -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                    </a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link btn btn-outline-light btn-sm ms-2" th:href="@{/register}">
                        <i class="bi bi-person-plus me-1"></i>Đăng ký
                    </a>
                </li>
                <!-- Authenticated user -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" onclick="toggleUserDropdown(event)">
                        <i class="bi bi-person-circle fs-5 me-1"></i>
                        <span class="d-none d-md-inline" th:text="${currentUserDisplayName ?: 'User'}">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown" id="userDropdownMenu">
                        <li class="px-3 py-2 border-bottom">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-person-circle fs-3 me-2 text-primary"></i>
                                <div>
                                    <div class="fw-semibold" th:text="${currentUserDisplayName ?: 'User'}">User</div>
                                    <small class="text-muted" th:text="${currentUser?.email}">email@example.com</small>
                                </div>
                            </div>
                        </li>
                        <li><a class="dropdown-item py-2" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Thông tin tài khoản</a></li>
                        <li><a class="dropdown-item py-2" th:href="@{/orders}"><i class="bi bi-bag me-2"></i>Đơn hàng của tôi</a></li>
                        <li><a class="dropdown-item py-2" th:href="@{/wishlist}"><i class="bi bi-heart me-2"></i>Sản phẩm yêu thích</a></li>
                        <li><a class="dropdown-item py-2" th:href="@{/change-password}"><i class="bi bi-shield-lock me-2"></i>Đổi mật khẩu</a></li>
                        <li><hr class="dropdown-divider my-1"></li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item py-2 text-primary fw-semibold" th:href="@{/admin}">
                                <i class="bi bi-speedometer2 me-2"></i>Trang quản trị
                            </a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider my-1"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item py-2 text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<script>
function toggleUserDropdown(event) {
    event.preventDefault();
    event.stopPropagation();
    var menu = document.getElementById('userDropdownMenu');
    var toggle = document.getElementById('userDropdown');
    
    if (menu.classList.contains('show')) {
        menu.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
    } else {
        menu.classList.add('show');
        toggle.setAttribute('aria-expanded', 'true');
    }
}

// Close dropdown when clicking outside
document.addEventListener('click', function(event) {
    var dropdown = document.getElementById('userDropdown');
    var menu = document.getElementById('userDropdownMenu');
    if (dropdown && menu && !dropdown.contains(event.target) && !menu.contains(event.target)) {
        menu.classList.remove('show');
        dropdown.setAttribute('aria-expanded', 'false');
    }
});
</script>

</body>
</html>
