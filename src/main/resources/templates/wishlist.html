<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <title>Sản phẩm yêu thích - ShopNest</title>
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<section class="py-5 bg-light min-vh-100">
    <div class="container">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Sản phẩm yêu thích</li>
            </ol>
        </nav>

        <div class="d-flex flex-wrap gap-3 align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Sản phẩm yêu thích</h2>
                <p class="text-muted mb-0">Các sản phẩm bạn đã lưu để mua sau</p>
            </div>
            <div class="ms-auto" th:if="${wishlist != null && !#lists.isEmpty(wishlist)}">
                <span class="badge bg-primary fs-6" th:text="${#lists.size(wishlist) + ' sản phẩm'}">5 sản phẩm</span>
            </div>
        </div>

        <!-- Wishlist Grid -->
        <div class="row g-4" th:if="${wishlist != null && !#lists.isEmpty(wishlist)}">
            <div class="col-6 col-md-4 col-lg-3" th:each="product : ${wishlist}">
                <div class="card product-card h-100 border-0 shadow-sm">
                    <div class="position-relative">
                        <a th:href="@{'/products/' + ${product.id}}">
                            <img th:src="${product.thumbnail}" class="card-img-top" alt="Product">
                        </a>
                        <button class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 remove-wishlist" 
                                th:data-id="${product.id}" title="Xóa khỏi yêu thích">
                            <i class="bi bi-heart-fill"></i>
                        </button>
                        <span class="badge bg-danger position-absolute top-0 start-0 m-2" th:if="${product.discount > 0}"
                              th:text="${'-' + product.discount + '%'}">-20%</span>
                    </div>
                    <div class="card-body">
                        <a th:href="@{'/products/' + ${product.id}}" class="text-decoration-none text-dark">
                            <h6 class="card-title text-truncate-2" th:text="${product.name}">Tên sản phẩm</h6>
                        </a>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span class="text-danger fw-bold" th:text="${#numbers.formatDecimal(product.salePrice ?: product.price, 0, 'COMMA', 0, 'POINT') + ' ₫'}">590.000 ₫</span>
                            <small class="text-muted text-decoration-line-through" th:if="${product.discount > 0}" 
                                   th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' ₫'}">750.000 ₫</small>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary btn-sm flex-grow-1 add-to-cart" th:data-id="${product.id}">
                                <i class="bi bi-cart-plus me-1"></i>Thêm vào giỏ
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="text-center py-5" th:if="${wishlist == null || #lists.isEmpty(wishlist)}">
            <div class="empty-state">
                <i class="bi bi-heart text-muted"></i>
                <h4 class="mt-3">Chưa có sản phẩm yêu thích</h4>
                <p class="text-muted">Hãy khám phá và thêm các sản phẩm bạn yêu thích vào đây!</p>
                <a th:href="@{/products}" class="btn btn-primary">
                    <i class="bi bi-bag me-2"></i>Khám phá sản phẩm
                </a>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<style>
.product-card {
    transition: transform 0.2s, box-shadow 0.2s;
}
.product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15) !important;
}
.text-truncate-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.empty-state i {
    font-size: 5rem;
}
.remove-wishlist {
    opacity: 0;
    transition: opacity 0.2s;
}
.product-card:hover .remove-wishlist {
    opacity: 1;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Remove from wishlist
    document.querySelectorAll('.remove-wishlist').forEach(btn => {
        btn.addEventListener('click', function() {
            const productId = this.dataset.id;
            // TODO: Call API to remove from wishlist
            this.closest('.col-6').remove();
        });
    });

    // Add to cart
    document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', function() {
            const productId = this.dataset.id;
            // TODO: Call API to add to cart
            alert('Đã thêm vào giỏ hàng!');
        });
    });
});
</script>

</body>
</html>
